[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools"

[project]
name = "browser_use_demo"
version = "0.1.0"
description = "A demo project for browser-use UI automation framework"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "browser-use>=0.1.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["browser_use_demo*"]